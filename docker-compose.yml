version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: efa_postgres
    restart: always
    environment:
      POSTGRES_DB: education_for_all
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: efa_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/backup.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education_for_all"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: efa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: efa_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:efa_secure_password_2026@postgres:5432/education_for_all?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "https://educationforall.baust.edu.bd"
      AUTH_SECRET: "replace-with-a-very-secure-random-secret-key-32chars"
      STORAGE_DRIVER: "local"
      LOCAL_UPLOAD_PATH: "/app/public/uploads"
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads

  caddy:
    image: caddy:2-alpine
    container_name: efa_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
